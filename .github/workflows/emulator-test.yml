name: emulator-test

# Device-level verification (V1-V5 partial, V15) on a GitHub Actions ubuntu
# runner with KVM. Manual dispatch only for now.
# Requires repo secret GPLAY_AUTH (contents of ~/.gplay-auth.json from the
# gplay-apk-downloader tool) to fetch Chrome + MacroDroid APKs with original
# signatures from Google Play.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Grant KVM access (udev rule, from android-emulator-runner docs)
        run: |
          ls -la /dev/kvm || { echo "::error::no KVM on runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install SDK pieces
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "system-images;android-34;google_apis;x86_64" "platforms;android-34" > /dev/null

      - name: Create and boot AVD
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n autoport -k "system-images;android-34;google_apis;x86_64" -d pixel_5 \
            || { echo "::error::avdmanager create failed"; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx autoport \
            || { echo "::error::AVD 'autoport' not registered"; \
                 ls -la "$ANDROID_AVD_HOME"; exit 1; }
          nohup "$ANDROID_HOME/emulator/emulator" -avd autoport \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -memory 2048 -no-snapshot > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 150); do
            if ! kill -0 $EMU_PID 2>/dev/null; then
              echo "::error::emulator process died"; tail -30 /tmp/emulator.log; exit 1
            fi
            boot=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ]; then echo "booted after ${i}0s-ish"; break; fi
            if [ $i -eq 150 ]; then
              echo "::error::boot timeout (25 min)"; tail -30 /tmp/emulator.log; exit 1
            fi
            sleep 10
          done
          "$ADB" devices

      - name: Fetch APKs (Chrome, MacroDroid) via Play
        env:
          GPLAY_AUTH: ${{ secrets.GPLAY_AUTH }}
        run: |
          git clone --depth 1 https://github.com/alltechdev/gplay-apk-downloader /tmp/gplay
          python3 -m venv /tmp/gplay/.venv
          /tmp/gplay/.venv/bin/pip install -q gpapi requests 'protobuf<4' cloudscraper pysocks
          printf '%s' "$GPLAY_AUTH" > ~/.gplay-auth.json
          cd /tmp/gplay
          .venv/bin/python gplay-downloader.py download com.android.chrome -o /tmp/apks || true
          .venv/bin/python gplay-downloader.py download com.arlosoft.macrodroid -o /tmp/apks
          .venv/bin/python gplay-downloader.py download com.llamalab.automate -o /tmp/apks
          python3 - <<'PYEOF'
          # Tasker trial APK from the official trial server (pinned build)
          import urllib.request
          url = "https://tasker.joaoapps.com/releases/nightly/Tasker-6.6.3-beta-20251002_1340.apk"
          urllib.request.urlretrieve(url, "/tmp/apks/Tasker-6.6.3-beta.apk")
          print("fetched Tasker trial APK")
          PYEOF
          ls -la /tmp/apks

      - name: "Install APKs (Chrome, MacroDroid, Automate, Tasker)"
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          for apk in /tmp/apks/*.apk; do
            "$ANDROID_HOME/platform-tools/adb" install -r -t "$apk" || echo "install failed: $apk"
          done
          "$ANDROID_HOME/platform-tools/adb" shell pm list packages | grep -E 'macrodroid|chrome|automate|dinglisch'

      - name: "Device matrix: versions + launch smoke for all three apps"
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB="$ANDROID_HOME/platform-tools/adb"
          for pkg in net.dinglisch.android.taskerm com.llamalab.automate com.arlosoft.macrodroid; do
            ver=$("$ADB" shell dumpsys package "$pkg" 2>/dev/null | grep -m1 versionName | tr -d '\r' | sed 's/.*versionName=//')
            echo "$pkg versionName=$ver"
            # launch smoke: start the main activity, wait, confirm the process is alive
            "$ADB" shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1
            sleep 8
            if "$ADB" shell pidof "$pkg" | grep -q .; then
              echo "$pkg: LAUNCH OK"
              launch=ok
            else
              echo "::warning::$pkg did not stay running after launch"
              launch=failed
            fi
            "$ADB" exec-out screencap -p > "/tmp/app-${pkg##*.}.png"
            printf '%s|%s|%s\n' "$pkg" "${ver:-unknown}" "$launch" >> /tmp/device-matrix.txt
          done
          cat /tmp/device-matrix.txt
          "$ADB" exec-out screencap -p > /tmp/three-apps-smoke.png || true

      - name: Serve AutoPort PWA + adb reverse
        run: |
          python3 -m http.server 8090 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" \
            & echo $! > /tmp/autoport-server.pid
          sleep 2
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          "$ANDROID_HOME/platform-tools/adb" reverse tcp:8090 tcp:8090
          # Chrome remote debugging over adb, for CDP page-content assertions
          "$ANDROID_HOME/platform-tools/adb" forward tcp:9222 localabstract:chrome_devtools_remote
          python3 -m pip install --quiet --user websocket-client

      - name: "V-PWA: load page in Chrome (localhost = secure context) + assert content via CDP"
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell am start -a android.intent.action.VIEW -d "http://localhost:8090/"
          sleep 12
          "$ADB" exec-out screencap -p > /tmp/pwa-load.png
          top=$("$ADB" shell dumpsys activity activities | grep -i 'topResumedActivity' | head -1)
          echo "top activity: $top"
          echo "$top" | grep -qi chrome || { echo "::warning::Chrome may not be the top activity"; }
          # Hard assertions on live page state (not just screenshots):
          # title, service worker controlling + activated, precache populated.
          python3 scripts/device_pwa_check.py assert-loaded --url "http://localhost:8090/"
          # On-device functional check: paste a Tasker XML, parse it, read #status.
          python3 scripts/device_pwa_check.py parse \
            --fixture tests/fixtures/tasker/LaunchInstagram.tsk.xml

      - name: "V5: offline after first load (kill server, reload from SW cache, parse offline)"
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Cut the only network path to the app: the adb-reversed dev server.
          kill "$(cat /tmp/autoport-server.pid)"
          sleep 1
          # Reload the page in Chrome — the service worker must serve the
          # shell from cache (the server is dead; a cache miss = network error).
          python3 scripts/device_cdp.py reload
          "$ADB" exec-out screencap -p > /tmp/pwa-offline-reload.png
          python3 scripts/device_pwa_check.py assert-loaded --url "http://localhost:8090/"
          # Offline parse proof (V5): data files must come from the precache.
          python3 scripts/device_pwa_check.py parse \
            --fixture tests/fixtures/tasker/LaunchInstagram.tsk.xml
          # Restart the server for any later steps that want the network back.
          python3 -m http.server 8090 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" \
            & echo $! > /tmp/autoport-server.pid
          sleep 2

      - name: "V15: MacroDroid MCP share-link import"
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB="$ANDROID_HOME/platform-tools/adb"
          # mint a share link for the proven minimal macro
          python3 - <<'EOF' > /tmp/share-link.txt
          import json, urllib.request
          macro = json.load(open('data/macrodroid/minimal-macro.json'))
          def rpc(method, params, mid):
              data = json.dumps({'jsonrpc':'2.0','id':mid,'method':method,'params':params}).encode()
              req = urllib.request.Request('https://remote.macrodroid.com/mcp', data=data,
                  headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          rpc('initialize', {'protocolVersion':'2025-03-26','capabilities':{},
              'clientInfo':{'name':'autoport-ci','version':'1.0'}}, 1)
          v = rpc('tools/call', {'name':'validate_macrodroid_macro',
              'arguments':{'macro_json': json.dumps(macro)}}, 2)
          print(json.dumps(v)[:300], file=__import__('sys').stderr)
          s = rpc('tools/call', {'name':'share_macrodroid_macro',
              'arguments':{'macro_json': json.dumps(macro)}}, 3)
          txt = json.dumps(s)
          import re
          m = re.search(r'https?://[^"\\\\ ]+', txt)
          print(m.group(0) if m else '')
          EOF
          LINK=$(tail -1 /tmp/share-link.txt)
          echo "share link: $LINK"
          if [ -z "$LINK" ]; then echo "::error::no share link minted"; cat /tmp/share-link.txt; exit 1; fi
          "$ADB" shell am start -a android.intent.action.VIEW -d "$LINK"
          sleep 20
          "$ADB" exec-out screencap -p > /tmp/macrodroid-import.png
          top=$("$ADB" shell dumpsys activity activities | grep -i 'topResumedActivity' | head -1)
          echo "top activity after link: $top"
          echo "$top" | grep -qi macrodroid || echo "::warning::MacroDroid not foreground; check screenshot"

      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            /tmp/device-matrix.txt
            /tmp/three-apps-smoke.png
            /tmp/pwa-load.png
            /tmp/pwa-offline-reload.png
            /tmp/macrodroid-import.png
            /tmp/emulator.log
            /tmp/share-link.txt
          if-no-files-found: ignore
